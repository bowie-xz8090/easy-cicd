config_version: 2

server:
  port: 8080
  workspace: "./workspace"
  title: "自动部署平台"
  base_path: ""

admin_token: "change-me-to-a-secure-random-string"

access:
  # 一项一个 IP 或 11 位手机号；手机号用户需先通过 SSO 登录。
  whitelist:
    - "172.16.106.1"
    - "172.16.106.2"
    - "172.16.106.3"
    - "172.16.106.4"
    - "172.16.106.5"
    - "172.16.106.6"
    - "172.16.106.7"
    - "172.16.106.8"
    - "172.16.106.9"
    - "172.16.106.10"
    - "172.16.105.5"
    - "172.16.105.6"
    - "172.16.105.7"
    - "172.16.105.8"
    - "172.16.105.9"
    - "172.16.105.10"
  trusted_proxies: []

# 内网管理台代理：每个服务使用独立端口/浏览器来源，保留目标的原生路径。
# SSH 凭据复用 servers，known_hosts 必须由可信渠道提供；不能跳过主机密钥校验。
# web_proxy:
#   known_hosts_file: "/app/ssh/known_hosts"
#   routes:
#     sit:
#       nacos:
#         target: "http://192.0.2.20:8848/nacos/"
#         ssh_server: "sit-main"
#         listen_port: 8081
#         public_url: "https://deploy.example.com:8443"
# public_url 是浏览器可达的服务入口；HTTPS 入口需要已有 TLS 终止代理。

gitea:
  url: "http://gitea.example.com"
  username: "your-username"
  token: "your-access-token"

# 非白名单 IP 用户需通过 OIDC 登录且手机号在白名单内；凭据仅在服务端维护。
# oidc:
#   issuer: "https://sso.example.com"
#   discovery_url: "https://sso.example.com/.well-known/openid-configuration"
#   client_id: "your-client-id"
#   client_secret: "your-client-secret"
#   redirect_uri: "https://deploy.example.com/api/auth/oidc/callback"

# 服务器是独立资源。生产环境可以关联多台服务器。
servers:
  dev-main:
    label: "开发服务器"
    host: "192.168.1.10"
    port: 22
    user: "root"
    password: "your-ssh-password"
    deploy_path: "/root/temp"
  sit-main:
    label: "测试服务器"
    host: "192.168.1.20"
    port: 22
    user: "root"
    password: "your-ssh-password"
    deploy_path: "/root/temp"
  prod-main:
    label: "生产主站"
    host: "192.168.1.30"
    port: 22
    user: "root"
    password: "your-ssh-password"
    deploy_path: "/root/temp"
  prod-region:
    label: "生产区域节点"
    host: "192.168.1.31"
    port: 22
    user: "root"
    password: "your-ssh-password"
    deploy_path: "/data/temp"

# 环境只维护访问入口、部署开关和允许使用的服务器范围。
environments:
  dev:
    label: "开发环境"
    disabled: false
    servers: [dev-main]
    links:
      user_url: "http://dev.example.com"
      admin_url: "http://dev-admin.example.com"
      extra: []
  sit:
    label: "测试环境"
    disabled: false
    servers: [sit-main]
    links:
      user_url: "http://sit.example.com"
      admin_url: "http://sit-admin.example.com"
      extra: []
  prod:
    label: "生产环境"
    disabled: false
    servers: [prod-main, prod-region]
    links:
      user_url: "https://www.example.com"
      admin_url: "https://admin.example.com"
      extra: []
    password: "change-me"

projects:
  # single：项目本身就是可部署单元，不再创建 default/main 等伪子项目。
  my-backend:
    label: "后端服务"
    mode: single
    build_type: backend
    environments:
      dev:
        build:
          command: "mvn clean package -DskipTests -Pdev"
          artifacts:
            - key: app
              output: "./target/app.jar"
              upload_as: "app.jar"
        deployments:
          dev-main:
            label: "开发服务器"
            server: dev-main
            script: "systemctl restart my-backend"
      sit:
        build:
          command: "mvn clean package -DskipTests -Psit"
          artifacts:
            - key: app
              output: "./target/app.jar"
              upload_as: "app.jar"
        deployments:
          sit-main:
            label: "测试服务器"
            server: sit-main
            script: "systemctl restart my-backend"
      prod:
        build:
          command: "mvn clean package -DskipTests -Pprod"
          artifacts:
            - key: app
              output: "./target/app.jar"
              upload_as: "app.jar"
        deployments:
          prod-main:
            label: "生产主站"
            server: prod-main
            script: "systemctl restart my-backend"
          prod-region:
            label: "生产区域节点"
            server: prod-region
            script: "systemctl restart my-backend-region"

  # monorepo：components 只对应 apps 下真实、独立的应用。
  my-frontend:
    label: "前端 Monorepo"
    mode: monorepo
    components:
      user-ui:
        label: "用户端"
        path: "apps/user-ui"
        build_type: frontend
        environments:
          dev:
            build:
              command: "pnpm install && pnpm build:dev --filter user-ui"
              artifacts:
                - key: web
                  output: "./apps/user-ui/dist"
                  upload_as: "user-ui.tar.gz"
            deployments:
              dev-main:
                label: "开发服务器"
                server: dev-main
                script: "tar -xzf /root/temp/user-ui.tar.gz -C /srv/user-ui"
          sit:
            build:
              command: "pnpm install && pnpm build:sit --filter user-ui"
              artifacts:
                - key: web
                  output: "./apps/user-ui/dist"
                  upload_as: "user-ui.tar.gz"
            deployments:
              sit-main:
                label: "测试服务器"
                server: sit-main
                script: "tar -xzf /root/temp/user-ui.tar.gz -C /srv/user-ui"
          prod:
            build:
              command: "pnpm install && pnpm build:prod --filter user-ui"
              artifacts:
                - key: web
                  output: "./apps/user-ui/dist"
                  upload_as: "user-ui.tar.gz"
            deployments:
              prod-main:
                label: "生产主站"
                server: prod-main
                script: "tar -xzf /root/temp/user-ui.tar.gz -C /srv/user-ui"
              prod-region:
                label: "生产区域节点"
                server: prod-region
                script: "tar -xzf /data/temp/user-ui.tar.gz -C /srv/user-ui"
